name: PR check
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # CI only needs pass/fail; skipping debug info shortens compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  changes:
    # Pull requests run only the groups their paths need; scripts/ci-changes.mjs holds the rules.
    # Self-hosted runners keep state between jobs, so they run only code from branches of this
    # repository; fork pull requests skip every job and fail ci-ok. See docs/release/README.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      windows: ${{ steps.groups.outputs.windows }}
      xtask: ${{ steps.groups.outputs.xtask }}
      node: ${{ steps.groups.outputs.node }}
      eval: ${{ steps.groups.outputs.eval }}
      execution: ${{ steps.groups.outputs.execution }}
      web: ${{ steps.groups.outputs.web }}
      scripts: ${{ steps.groups.outputs.scripts }}
      dependencies: ${{ steps.groups.outputs.dependencies }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The merge commit and its base parent.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select check groups
        id: groups
        run: node scripts/ci-changes.mjs
      - name: Check accepted ADRs
        if: github.event_name == 'pull_request'
        env:
          DIM_DOCS_ADR_ERRATUM: ${{ contains(github.event.pull_request.labels.*.name, 'adr-erratum') && '1' || '0' }}
        run: node scripts/adr-check.mjs --base HEAD^1
  dependencies:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.dependencies == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version '=0.20.2'
      - name: Check dependency advisories and licenses
        run: cargo deny --locked check advisories licenses
  windows-cli:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify native Windows CLI boundaries
        run: cargo test --locked -p dim-cli --lib
  verify:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.xtask == 'true' ||
      needs.changes.outputs.web == 'true' || needs.changes.outputs.scripts == 'true'
    # PR runners must be isolated from release credentials and private networks.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and lint the Rust workspace
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          features=()
          if [[ '${{ needs.changes.outputs.eval }}' == true ]]; then
            features+=(--features xtask/eval-tests)
          fi
          cargo clippy --workspace --all-targets --locked ${features[@]+"${features[@]}"} -- -D warnings
          cargo build --workspace --all-targets --locked ${features[@]+"${features[@]}"} --message-format=json > target/test-artifacts.jsonl
      - name: Run compiled workspace tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl --workspace --test-threads=4
          cargo test --workspace --doc --locked ${{ needs.changes.outputs.eval == 'true' && '--features xtask/eval-tests' || '' }}
      - name: Verify wall-clock background handoff
        if: needs.changes.outputs.execution == 'true'
        run: node scripts/run-rust-test.mjs target/test-artifacts.jsonl local_execution a_long_foreground_command_moves_to_the_background_after_30_seconds --ignored --exact
      - name: Check crate boundaries and plugin pages
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.xtask == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ needs.changes.outputs.rust }}' != true ]]; then
            cargo build --locked -p xtask
          fi
          target/debug/xtask check
      - name: Test development and release scripts
        if: needs.changes.outputs.scripts == 'true'
        run: |
          node --check scripts/check-acp-registry.mjs
          node --test scripts/*.test.mjs
      - name: Build the Web workspace
        if: needs.changes.outputs.web == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The frontend is a separate artifact; building it here type-checks web/.
          node scripts/stage-web.mjs staging/release-web "$(node -p "require('./npm/package.json').version")" "$GITHUB_SHA"
          npm test --prefix web
      - name: Verify actual CLI profiles and terminal launcher
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix runtime --ignore-scripts --registry=https://registry.npmjs.org
          # The ignored CLI flows below start the real plugins, so their
          # packages are installed here, before the flows; the job's checkout
          # carries them into the Node binding checks as well.
          npm ci --prefix runtime/plugins/goal --ignore-scripts --registry=https://registry.npmjs.org
          npm ci --prefix runtime/plugins/workflow --ignore-scripts --registry=https://registry.npmjs.org
          (cd runtime && npm install --no-save --ignore-scripts --install-links ./plugins/goal ./plugins/workflow)
          export DIM_TEST_APP_SERVER="$PWD/target/debug/dim-app-server"
          export DIM_TEST_NPM_WRAPPER="$PWD/npm/bin/dimcode.mjs"
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl cli_flow --ignored
      - name: Verify public Node bindings
        if: needs.changes.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 0.19's TypeScript test tool runs plugins on a real rutis-host; the
          # tests run from the repository root, so name it explicitly.
          export RUTIS_HOST="$PWD/runtime/node_modules/.bin/rutis-host"
          node --test runtime/plugin-sdk.test.mjs
          node --test runtime/plugins/goal/goal.test.mjs
          # The workflow plugin tests stay off: no double of a
          # test's can receive the plugin definition they register, because
          # 0.19.3's test tool does not take one (rutis-0.19-upgrade M10). The
          # Node-backed Rust flows below still load them for real, and `tsc`
          # checks them; goal has no tsconfig.
          node runtime/node_modules/typescript/bin/tsc -p runtime/plugins/workflow/tsconfig.json
          # The Python of `py:` rows: a relocatable CPython, pinned by hash, so the
          # self-hosted runner needs neither a system Python 3.10+ nor sudo.
          python_build="cpython-3.12.15+20261003-aarch64-apple-darwin-install_only.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20261003/${python_build/+/%2B}"
          echo "316a463172740e71d8dca1f2730784e325f3f720941137b5d674d5801a632213  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/python" runtime/.venv
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/python/bin/python3" -m venv runtime/.venv
          runtime/.venv/bin/python -m pip install --require-hashes --no-deps -r runtime/python-requirements.txt
          export PATH="$RUNNER_TEMP/python/bin:$PATH"
          export DIM_TEST_NODE="$(command -v node)"
          export DIM_TEST_JS_RUNTIME="$PWD/runtime/node_modules/@arcships/rutis-runtime"
          export DIM_TEST_RUTIS_SDK="$PWD/runtime/node_modules/@arcships/rutis/src/index.mjs"
          export DIM_TEST_PYTHON="$PWD/runtime/.venv/bin/python"
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl transport_flow node_ --ignored
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl mcp_http_flow node_ --ignored
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl migration_flow node_ --ignored
          if [[ '${{ needs.changes.outputs.eval }}' == true ]]; then
            node scripts/run-rust-test.mjs target/test-artifacts.jsonl xtask node_ --ignored
          fi
  acp-registry:
    needs: changes
    if: github.event_name != 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b
        with:
          cache: false
          build-warnings: ""
      - name: Build the account executable
        env:
          DIM_OAUTH_CLIENT_ID_CN: ${{ secrets.DIM_OAUTH_CLIENT_ID_CN }}
          DIM_OAUTH_CLIENT_ID_GLOBAL: ${{ secrets.DIM_OAUTH_CLIENT_ID_GLOBAL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DIM_OAUTH_CLIENT_ID_CN" || -z "$DIM_OAUTH_CLIENT_ID_GLOBAL" ]]; then
            echo 'ACP Registry acceptance requires both OAuth client ID secrets.' >&2
            exit 1
          fi
          cargo build --locked -p dimcode
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: agentclientprotocol/registry
          ref: 49f768659a8089f07874f56a0d474312695ad861
          path: .acp-registry
          persist-credentials: false
      - name: Verify upstream Registry authentication and protocol
        shell: bash
        run: node scripts/check-acp-registry.mjs target/debug/dimcode .acp-registry "$RUNNER_TEMP/acp-registry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acp-registry
          path: ${{ runner.temp }}/acp-registry-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 1
  ci-ok:
    # The one check to require: it passes when every selected job passed and skipped jobs were not needed.
    needs: [changes, dependencies, windows-cli, verify, acp-registry]
    if: always()
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    steps:
      # A skipped changes job means a fork pull request, which this workflow does not verify.
      - name: Fail unless every selected job passed
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
