<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: Android's keyboard shrinks the layout (and 100dvh) so the composer stays above it; html/body never scroll, so the default resizes-visual would leave it covered. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <title>野塘漫水</title>
    <!-- The brand mark inline: the host serves only /assets/*, so an icon file at the
         site root would come back as index.html. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20fill%3D%22%23349651%22%20fill-rule%3D%22evenodd%22%20d%3D%22M30%2035L45.43%2053.38A24%2024%200%201%200%2039.76%2056.92ZM33.1%2025.9a5.5%205.5%200%201%200%2011%200a5.5%205.5%200%201%200-11%200Z%22%2F%3E%3C%2Fsvg%3E" />
    <!-- Painted before the bundle loads (CSP allows inline styles, not inline scripts), so
         the page follows the system theme instead of flashing white. Mirrors global.css
         tokens and AppRoot's connecting state, which Vue swaps in over it. -->
    <style>
      html { background: oklch(1 0 0); color: oklch(0.6 0.138 150); }
      @media (prefers-color-scheme: dark) { html { background: oklch(0.16 0 0); color: oklch(0.76 0.15 149); } }
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-splash svg { width: 56px; height: 56px; overflow: visible; }
      .boot-splash circle { fill: none; stroke: currentColor; stroke-width: 2; opacity: 0; transform-origin: 30px 35px; animation: boot-ripple 1.8s ease-out infinite; }
      @keyframes boot-ripple { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.32); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash circle { display: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-label="Loading">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="30" cy="35" r="26" />
          <circle cx="30" cy="35" r="26" style="animation-delay: -0.9s" />
          <path fill="currentColor" fill-rule="evenodd" d="M30 35L45.43 53.38A24 24 0 1 0 39.76 56.92ZM33.1 25.9a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0-11 0Z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
