[workspace]
resolver = "2"
members = ["crates/dim-agent-types", "crates/dim-agent-runtime", "crates/dim-agent-capabilities", "crates/dim-agent-aimux", "crates/dim-agent-attachments", "crates/dim-agent-questions", "crates/dim-agent-scheduler", "crates/dim-app-server", "crates/dim-client", "crates/dim-acp", "crates/dim-cli", "crates/dim-oauth", "crates/dim-session-title", "crates/dim-goal", "crates/dimcode", "crates/dim-migration", "xtask", "tests/extension-a", "tests/extension-b", "tests/integration"]
exclude = ["vendor/aimux", "vendor/grok-build"]

[workspace.package]
version = "0.1.0-alpha.18"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/arcships/dim"

[workspace.dependencies]
rutis = "0.19.3"
rutis-loader = { version = "0.19.3", features = ["node"] }
rutis-bridge = "0.19.3"
schemars = "1"
dim-agent-types = { path = "crates/dim-agent-types" }
dim-agent-runtime = { path = "crates/dim-agent-runtime" }
dim-agent-capabilities = { path = "crates/dim-agent-capabilities" }
dim-agent-aimux = { path = "crates/dim-agent-aimux" }
dim-agent-attachments = { path = "crates/dim-agent-attachments" }
dim-agent-questions = { path = "crates/dim-agent-questions" }
aimux-core = { path = "vendor/aimux/aimux-core" }
aimux-provider-utils = { path = "vendor/aimux/aimux-provider-utils" }
aimux-providers = { path = "vendor/aimux/aimux-providers", default-features = false }
dim-app-server = { path = "crates/dim-app-server" }
dim-session-title = { path = "crates/dim-session-title" }
dim-goal = { path = "crates/dim-goal" }
dim-client = { path = "crates/dim-client" }
dim-migration = { path = "crates/dim-migration" }
dim-acp = { path = "crates/dim-acp" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time", "net", "process", "io-util", "signal", "fs"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0.20"
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
