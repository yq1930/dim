[package]
name = "dimcode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The single dimcode executable: the CLI, with the App Server as its `app-server` subcommand"

[[bin]]
name = "dimcode"
path = "src/main.rs"

[features]
# Compile the Web workspace into the executable (dim-app-server's feature).
embedded-web = ["dim-app-server/embedded-web"]

[dependencies]
dim-cli = { path = "../dim-cli" }
dim-app-server.workspace = true
dim-session-title.workspace = true
dim-goal.workspace = true
dim-oauth = { path = "../dim-oauth" }
dim-agent-scheduler = { path = "../dim-agent-scheduler" }
dim-agent-runtime.workspace = true

[dev-dependencies]
dim-agent-capabilities.workspace = true
agent-client-protocol-schema = { version = "=1.12.0", default-features = false }
base64 = "0.22.1"
sha2 = "0.10.9"
dim-agent-types.workspace = true
url = "2"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde_json.workspace = true
uuid.workspace = true
libc = "0.2"
rutis.workspace = true
rutis-bridge.workspace = true
tokio.workspace = true
rusqlite = "0.40.2"
