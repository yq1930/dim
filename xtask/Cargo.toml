[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[features]
eval-tests = []
[dependencies]
rusqlite = { version = "0.40.2", features = ["backup"] }
dim-agent-runtime = { workspace = true, features = ["testing"] }
dim-agent-capabilities.workspace = true
dim-agent-aimux.workspace = true
dim-agent-attachments.workspace = true
dim-agent-questions.workspace = true
dim-app-server.workspace = true
dim-session-title.workspace = true
dim-goal.workspace = true
dim-agent-types.workspace = true
dim-client.workspace = true
rutis.workspace = true
rutis-bridge.workspace = true
rutis-types = "0.19.3"
rutis-loader.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
syn = { version = "2", features = ["full", "visit"] }
[dev-dependencies]
axum = { workspace = true, features = ["json"] }
