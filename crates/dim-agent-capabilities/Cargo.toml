[package]
name = "dim-agent-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dim-agent-types.workspace = true
dim-agent-runtime.workspace = true
rutis.workspace = true
rutis-bridge.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
encoding_rs = "0.8.35"
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.25"
regex = "1.13.1"
sha2 = "0.10.9"
similar = "2.7.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
portable-pty = "0.9.0"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pdf-extract = "0.12.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell"] }

[features]
# Hooks that race flow tests use to hold an operation open.
testing = []

[dev-dependencies]
dim-agent-runtime = { workspace = true, features = ["testing"] }
# The flow tests drive the projection with recorded histories through the
# `testing` module; a self dev-dependency enables the feature for them.
dim-agent-capabilities = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
